storage:
  db_path: ~/.spark/spark.db
  artifacts_dir: ~/.spark/artifacts
llm:
  provider: openai-compatible
  model: your-model-id
  embedder_model: your-embedder-id
  degraded_mode: auto          # auto | require-key | never-llm
peers:
  quantflow:  { enabled: false }
  alpha_engine:
    enabled: false
    transport: stdio
    command: /path/to/alpha_engine/.venv/bin/python
    args: ["-m", "alpha_engine.mcp_server"]
  documents:  { enabled: false }
research:
  novelty_weights: [0.5, 0.3, 0.2]
  sigma_floor: 0.01
  s_cap: 5.0
  family_count_norm: 20        # cell_emptiness v1 normalizer (QD grid: Phase 5)
  exploration_bonus_uniform: 0.5  # bandit posteriors replace this in Phase 5
  family_weight_floor: 0.05   # off-family relevance floor (deterministic mode)
  family_morph_min_len: 4     # substring-match min length for family vocab
  family_part_discount: 0.3   # part-of-compound tag match discount
  family_affix_discount: 0.5  # affix-bounded derivation match discount
  family_middle_discount: 0.5 # middle-word-of-concept match discount
  family_size_norm_exponent: 0.5  # deflate raw matches by family vocab size
  selection_score_band: 0.12   # defensible-set band for softmax pool (§8.2)
  selection_min_eligible: 24  # keep the pool stochastic (G1 repeat-overlap)
  selection_pool_extra: 0     # pool size = k + extra, drawn from eligible
  selection_obvious_drop: 1   # exclude the top scorer (surface challengers)
  family_fit_factor_exponent: 0.5  # softened family factor on the fit channel
  selection_pool_temp_multiplier: 3.0  # flatten pool draws (G1 exploration)
  scoring_weights: [0.35, 0.20, 0.20, 0.15, 0.10]
  temperatures: { safe: 0.3, balanced: 0.7, exploratory: 1.2 }
  mmr_lambda: 0.5
  top_k: 50
  rrf_k: 60
  bandit_prior: [1.0, 1.0]
  budget: { refine: 0.60, new_cell: 0.25, long_shot: 0.15 }
  budget_override_band: 0.15
  budget_window_days: 7
  analogy_cap: 0.20
  ucb_c: 1.4
  tombstone_block: 0.85
  tombstone_review_low: 0.70
  belief_auto_promote_threshold: 0.8
  belief_halflife_days: 180
  belief_validation_slo_days: 90
  contradiction_cos: 0.75
  qd_grid: [8, 6, 4]
  qd_descriptors: [family, horizon, turnover]
  dsr_alpha: 0.05
  kill_rule_failures: 5
  min_T: 30
budgets:
  daily_usd: 25.0
  per_episode_usd: 5.0
  per_consolidation_usd: 3.0
  policy: warn                 # warn | fail_closed
  rates: {}
