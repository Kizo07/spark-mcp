storage:
  db_path: ~/.spark/spark.db
  artifacts_dir: ~/.spark/artifacts
llm:
  provider: openai-compatible
  model: your-model-id
  embedder_model: your-embedder-id
  degraded_mode: auto          # auto | require-key | never-llm
peers:
  quantflow:  { enabled: false }
  alpha_engine:
    enabled: false
    transport: stdio
    command: /path/to/alpha_engine/.venv/bin/python
    args: ["-m", "alpha_engine.mcp_server"]
  documents:  { enabled: false }
  gateway:                       # QuantFlow skill-write API (plan §11 C7);
    enabled: false               # default absent -> promotion writes block
    url: null                    #   with GatewayWriteBlocked; champions stay
    token_env: QUANTFLOW_GATEWAY_TOKEN  # staged in Spark's registry
research:
  novelty_weights: [0.5, 0.3, 0.2]
  sigma_floor: 0.01
  s_cap: 5.0
  family_count_norm: 20        # cell_emptiness degraded-mode normalizer (§7)
  exploration_bonus_uniform: 0.5  # fallback for families with no stored posterior (§8.3)
  family_weight_floor: 0.05   # off-family relevance floor (deterministic mode)
  family_morph_min_len: 4     # substring-match min length for family vocab
  family_part_discount: 0.3   # part-of-compound tag match discount
  family_affix_discount: 0.5  # affix-bounded derivation match discount
  family_middle_discount: 0.5 # middle-word-of-concept match discount
  family_size_norm_exponent: 0.5  # deflate raw matches by family vocab size
  selection_score_band: 0.12   # defensible-set band for softmax pool (§8.2)
  selection_min_eligible: 24  # keep the pool stochastic (G1 repeat-overlap)
  selection_pool_extra: 0     # pool size = k + extra, drawn from eligible
  selection_obvious_drop: 1   # exclude the top scorer (surface challengers)
  family_fit_factor_exponent: 0.5  # softened family factor on the fit channel
  selection_pool_temp_multiplier: 3.0  # flatten pool draws (G1 exploration)
  scoring_weights: [0.35, 0.20, 0.20, 0.15, 0.10]
  temperatures: { safe: 0.3, balanced: 0.7, exploratory: 1.2 }
  mmr_lambda: 0.5
  top_k: 50
  rrf_k: 60
  bandit_prior: [1.0, 1.0]
  budget: { refine: 0.60, new_cell: 0.25, long_shot: 0.15 }
  budget_override_band: 0.15
  budget_window_days: 7
  analogy_budget_cap: 0.20   # §8.3: analogy searches cap = fraction of family trials
  analogy_systematicity_threshold: 0.5  # §6.1 tool 4: mappings below are refused
  gap_boost_factor: 1.5      # §13/G5: utility boost for gap-report families
  skill_candidate_stale_days: 14  # §13: pending candidates older than this gap
  predictor_error_outlier: 0.05    # §21: family mean |pred-realized| outlier floor
  report_html_renderer: deferred  # §18.1 decision: HTML renderer DEFERRED (md-only)
  ucb_c: 1.4
  tombstone_block: 0.85
  tombstone_review_low: 0.70
  belief_auto_promote_threshold: 0.8
  belief_halflife_days: 180
  belief_validation_slo_days: 90
  contradiction_cos: 0.75
  qd_grid: [8, 6, 4]
  qd_descriptors: [family, horizon, turnover]
  # QD descriptor bins (§10.1): first five family bins mirror the seed corpus;
  # nlp/macro/portfolio reserve adjacent desks. Unknown categories are refused.
  qd_family_bins: [quant, econometrics, causal, signal_processing,
                   network_optimization, nlp, macro, portfolio]
  qd_horizon_bins: [1d, 5d, 20d, 60d, 120d, long]
  qd_turnover_bins: [low, medium, high, very_high]
  qd_turnover_thresholds: [0.25, 0.75, 1.5]  # upper bounds: low/medium/high
  # Elite score weights (§10.2); causal adds stability from the same budget
  # (others x (1 - qd_causal_stability_weight)); descriptive/execution use the
  # reduced non-Sharpe set and are excluded from insertion by default.
  qd_reward_weights: {oos: 0.30, deflated_significance: 0.20, robustness: 0.15,
                      orthogonality: 0.15, novelty: 0.10, efficiency: 0.10}
  qd_causal_stability_weight: 0.10
  qd_reduced_reward_weights: {robustness: 0.30, orthogonality: 0.30,
                              novelty: 0.20, efficiency: 0.20}
  qd_archive_status_top_n: 10
  dsr_alpha: 0.05
  kill_rule_failures: 5
  min_T: 30
  # Phase 6 skill evolution (plan §11): GEPA caps bound the native loop; a
  # replay heldout_gap above the alarm flags the fixture set for review (§21).
  gepa_population_size: 6
  gepa_generations: 2
  gepa_pareto_top_k: 3
  replay_heldout_gap_alarm: 0.25
budgets:
  daily_usd: 25.0
  per_episode_usd: 5.0
  per_consolidation_usd: 3.0
  policy: warn                 # warn | fail_closed
  rates: {}
