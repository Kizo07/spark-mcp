  license: CC0-1.0

- name: Sampling
  mechanism_tags: [signal_processing, data]
  summary: Discrete observation of a continuous process; the sampling scheme determines which frequencies are representable.
  source: spark-curated
  license: CC0-1.0

- name: Scale bias
  mechanism_tags: [networks, estimation]
  summary: Heterogeneous node scales bias aggregation and spectral estimates; normalization is required.
  source: spark-curated
  license: CC0-1.0

- name: Scale sensitivity
  mechanism_tags: [estimation, hyperparameters]
  summary: Estimates swing with the units or scale of inputs; without normalization, comparisons are meaningless.
  source: spark-curated
  license: CC0-1.0

- name: Sentiment driven demand
  mechanism_tags: [sentiment, behavioral]
  summary: Non-fundamental demand shifts prices from value until sentiment reverts.
  source: spark-curated
  license: CC0-1.0

- name: Shrinkage target
  mechanism_tags: [estimation, shrinkage]
  summary: A structured estimator, such as constant correlation or a single-factor model, toward which noisy sample estimates are shrunk.
  source: spark-curated
  license: CC0-1.0

- name: Sigma point scaling
  mechanism_tags: [unscented, parameters]
  summary: The spread of sigma points around the mean; mis-scaling misrepresents the transformed covariance.
  source: spark-curated
  license: CC0-1.0

- name: Signal combination
  mechanism_tags: [combination, forecasting]
  summary: Combining imperfectly correlated signals can beat any single one; naive weighting inherits the worst of each.
  source: spark-curated
  license: CC0-1.0

- name: Skewness preference
  mechanism_tags: [preferences, behavioral]
  summary: Investors pay up for positively skewed payoffs, depressing those assets' expected returns.
  source: spark-curated
  license: CC0-1.0

- name: Slow detection
  mechanism_tags: [monitoring, latency]
  summary: Change points surface long after they occur; the strategy trades the wrong regime meanwhile.
  source: spark-curated
  license: CC0-1.0

- name: Small sample
  mechanism_tags: [statistics, inference]
  summary: Few observations relative to noise; estimates turn unstable and classical approximations unreliable.
