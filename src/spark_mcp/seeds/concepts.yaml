  license: CC0-1.0

- name: Local optima
  mechanism_tags: [optimization, nonconvex]
  summary: Non-convex objectives carry many suboptimal stationary points; optimizers may settle far from the global best.
  source: spark-curated
  license: CC0-1.0

- name: Local time scales
  mechanism_tags: [emd, multi_scale]
  summary: Each oscillatory component carries its own instantaneous timescale; mixing scales inside one component breaks the method.
  source: spark-curated
  license: CC0-1.0

- name: Low power
  mechanism_tags: [statistics, inference]
  summary: A test rarely rejects false nulls; insignificant results carry little evidence.
  source: spark-curated
  license: CC0-1.0

- name: Manager timing
  mechanism_tags: [fund_flows, behavioral]
  summary: Managers time their own issuance and positioning; that timing is informative about future returns.
  source: spark-curated
  license: CC0-1.0

- name: Manipulation
  mechanism_tags: [rdd, validity]
  summary: Agents sorting precisely around the cutoff breaks regression-discontinuity identification.
