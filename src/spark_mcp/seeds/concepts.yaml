  license: CC0-1.0

- name: Spectral density
  mechanism_tags: [spectral, frequency]
  summary: How signal power distributes over frequencies; the frequency-domain fingerprint of a process.
  source: spark-curated
  license: CC0-1.0

- name: Spectral leakage
  mechanism_tags: [spectral, estimation]
  summary: Finite windows smear power across frequencies, contaminating neighboring spectral estimates.
  source: spark-curated
  license: CC0-1.0

- name: State misspecification
  mechanism_tags: [state_space, regimes]
  summary: Wrong number or nature of latent states; hidden Markov inference partitions noise into phantom regimes.
