  license: CC0-1.0

- name: Matching bias
  mechanism_tags: [matching, causal]
  summary: Imperfect matches leave covariate imbalance; the comparison inherits the remaining bias.
  source: spark-curated
  license: CC0-1.0

- name: Mediation misspecification
  mechanism_tags: [mediation, causal]
  summary: Wrongly specified mediator paths, with unmeasured mediators or confounded paths, corrupt the decomposition.
  source: spark-curated
  license: CC0-1.0

- name: Mediation validity
  mechanism_tags: [mediation, causal]
  summary: The proposed mediator genuinely lies on the causal path; mediation analysis assumes correct path structure.
  source: spark-curated
  license: CC0-1.0

- name: Metric property
  mechanism_tags: [geometry, distance]
  summary: Distances must be symmetric and satisfy the triangle inequality; violations break metric-space methods.
  source: spark-curated
  license: CC0-1.0

- name: Misspecification
  mechanism_tags: [specification, econometrics]
  summary: The functional form omits relevant structure, biasing every inference drawn from it.
  source: spark-curated
  license: CC0-1.0

- name: Mixing linearity
  mechanism_tags: [ica, model]
  summary: Observations are a linear mixture of sources; nonlinear mixing needs different separation tools.
  source: spark-curated
  license: CC0-1.0

- name: Mode mixing
  mechanism_tags: [emd, decomposition]
  summary: One physical timescale splits across IMFs, or several merge into one, corrupting the decomposition.
  source: spark-curated
  license: CC0-1.0

- name: Model misspecification
  mechanism_tags: [state_space, filtering]
  summary: Wrong dynamics or observation equations make the filter confidently estimate the wrong state.
  source: spark-curated
  license: CC0-1.0

- name: Moment validity
  mechanism_tags: [gmm, statistics]
  summary: Population moments must exist; heavy tails break moment-based estimators and inference.
  source: spark-curated
  license: CC0-1.0

- name: Monotonicity
  mechanism_tags: [identification, causal]
  summary: The effect runs in one direction, whether a monotone quantile link or treatment monotone in the instrument; enables ordered and IV identification.
  source: spark-curated
  license: CC0-1.0

- name: Multi scale structure
  mechanism_tags: [wavelets, decomposition]
  summary: Phenomena organize across scales; separating scales exposes structure invisible in aggregates.
  source: spark-curated
  license: CC0-1.0

- name: Multiple cointegrating vectors
  mechanism_tags: [cointegration, multivariate]
  summary: Several independent long-run relations bind the system; misjudged rank mis-specifies every spread.
  source: spark-curated
  license: CC0-1.0

- name: Near unit root
  mechanism_tags: [time_series, persistence]
  summary: High persistence mimics a random walk over finite samples, breaking standard inference.
  source: spark-curated
  license: CC0-1.0

- name: No anticipation
  mechanism_tags: [diff_in_diff, causal]
  summary: Units do not react before treatment starts; anticipation contaminates the pre-period counterfactual.
  source: spark-curated
  license: CC0-1.0

- name: No interference
  mechanism_tags: [causal, identification]
  summary: One unit's treatment does not affect others' outcomes; violated by spillovers and market-wide effects.
  source: spark-curated
  license: CC0-1.0

- name: No unmeasured confounding
  mechanism_tags: [causal, identification]
  summary: All confounders are observed and adjustable; the selection-on-observables assumption.
  source: spark-curated
  license: CC0-1.0

- name: Non Gaussianity
  mechanism_tags: [ica, distributions]
  summary: Independent components are recoverable only through non-Gaussianity; Gaussian sources do not separate.
  source: spark-curated
  license: CC0-1.0

- name: Nonconvergence
  mechanism_tags: [optimization, numerics]
  summary: The optimizer never settles on a stable solution, making outputs seed-dependent noise.
  source: spark-curated
  license: CC0-1.0

- name: Normal returns
  mechanism_tags: [assumptions, distributions]
  summary: Returns are approximately Gaussian; the working assumption of mean-variance and many closed-form allocations.
  source: spark-curated
  license: CC0-1.0

- name: Optimization convergence
  mechanism_tags: [optimization, numerics]
  summary: Iterative optimizers must reach the intended optimum; loose tolerance or ill conditioning silently degrades the solution.
  source: spark-curated
  license: CC0-1.0

- name: Outliers
  mechanism_tags: [robust_statistics, data_quality]
  summary: Extreme observations from contamination or error; they dominate unrobust estimates.
  source: spark-curated
  license: CC0-1.0

- name: Overbetting
  mechanism_tags: [kelly, sizing]
  summary: Betting beyond the Kelly fraction slows or destroys growth; fractional Kelly hedges estimation error.
  source: spark-curated
  license: CC0-1.0

- name: Overlapping windows
  mechanism_tags: [spectral, estimation]
  summary: Overlapping segments add dependent information; treating them as independent understates variance.
  source: spark-curated
  license: CC0-1.0

- name: Parallel trends
  mechanism_tags: [diff_in_diff, causal]
  summary: Treated and control would have followed the same trend absent treatment; the diff-in-diff assumption.
  source: spark-curated
  license: CC0-1.0

- name: Parameter instability
  mechanism_tags: [regimes, estimation]
  summary: True parameters shift within the sample; single-regime estimates predict neither regime.
  source: spark-curated
  license: CC0-1.0

- name: Parameter proliferation
  mechanism_tags: [overfitting, dimensionality]
  summary: Each added parameter fits noise harder; past data support, out-of-sample skill collapses.
  source: spark-curated
  license: CC0-1.0

- name: Passive flow predictability
  mechanism_tags: [flow, indexing]
  summary: Rebalances and creations or redemptions of passive funds move predictable baskets at predictable times.
  source: spark-curated
  license: CC0-1.0

- name: Positivity
  mechanism_tags: [causal, identification]
  summary: Every covariate stratum has positive probability of each treatment level; without it counterfactuals are not estimable.
  source: spark-curated
  license: CC0-1.0

- name: Positivity violation
  mechanism_tags: [causal, identification]
  summary: Some strata never receive one treatment level; extrapolating to them is unsupported and dangerous.
  source: spark-curated
  license: CC0-1.0

- name: Predictability of regimes
  mechanism_tags: [regimes, forecasting]
  summary: Regime switches carry enough structure in duration and indicators to be partially forecast.
  source: spark-curated
  license: CC0-1.0

- name: Prior sensitivity
  mechanism_tags: [bayesian, robustness]
  summary: Posterior conclusions move with prior choices; sensitivity to the prior marks fragile results.
  source: spark-curated
  license: CC0-1.0

- name: Quasi diag errors
  mechanism_tags: [hierarchical, estimation]
  summary: Approximation error in quasi-diagonalization perturbs the covariance estimate and compounds down the tree.
  source: spark-curated
  license: CC0-1.0

- name: Random matrix null
  mechanism_tags: [random_matrix, noise]
  summary: Under pure noise, eigenvalues follow the Marchenko-Pastur law; deviations indicate true factor structure.
  source: spark-curated
  license: CC0-1.0

- name: Rate shocks
  mechanism_tags: [rates, macro]
  summary: Sudden policy or inflation surprises reprice duration and discount rates across assets.
  source: spark-curated
  license: CC0-1.0

- name: Rational objective
  mechanism_tags: [decision_theory, preferences]
  summary: The agent maximizes a coherent, consistent preference ordering; the benchmark behavioral biases deviate from.
  source: spark-curated
  license: CC0-1.0

- name: Redundancy
  mechanism_tags: [signal_processing, representation]
  summary: Overlapping information across components or scales; redundant representations waste degrees of freedom.
  source: spark-curated
  license: CC0-1.0

- name: Regime classification error
  mechanism_tags: [regimes, inference]
  summary: The current regime is mis-identified; positions sized for the wrong regime lose on both sides.
  source: spark-curated
  license: CC0-1.0

- name: Regime persistence
  mechanism_tags: [regimes, duration]
  summary: Regimes last long enough to identify and exploit; short-lived regimes defeat regime-switching strategies.
  source: spark-curated
  license: CC0-1.0

- name: Regulatory risk
  mechanism_tags: [policy, events]
  summary: Rule changes or enforcement can invalidate a strategy's premise overnight.
  source: spark-curated
  license: CC0-1.0

- name: Residual bias
  mechanism_tags: [estimation, bias]
  summary: Bias remaining after adjustment; its size bounds how much the estimate can be trusted.
