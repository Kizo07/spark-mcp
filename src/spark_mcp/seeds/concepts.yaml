  license: CC0-1.0

- name: Timing risk
  mechanism_tags: [events, execution]
  summary: The catalyst calendar is uncertain; positions taken too early bleed carry until the event lands.
  source: spark-curated
  license: CC0-1.0

- name: Tree structure
  mechanism_tags: [hierarchical, covariance]
