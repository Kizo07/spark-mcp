  license: CC0-1.0

- name: Sufficient data
  mechanism_tags: [statistics, data]
  summary: Enough observations relative to model complexity; without it, flexible models memorize noise.
  source: spark-curated
  license: CC0-1.0

- name: Sufficient time series
  mechanism_tags: [time_series, data]
  summary: A long enough history to identify dynamics; short series cannot separate persistence from noise.
  source: spark-curated
  license: CC0-1.0

- name: Term premium
  mechanism_tags: [rates, asset_pricing]
  summary: Long bonds earn expected excess returns as compensation for duration risk beyond expected short rates.
  source: spark-curated
  license: CC0-1.0

- name: Threshold dynamics
  mechanism_tags: [nonlinear, regimes]
  summary: The process switches behavior when a variable crosses a threshold, producing state-dependent moves.
  source: spark-curated
  license: CC0-1.0

- name: Threshold effect
  mechanism_tags: [nonlinear, causal]
  summary: A discontinuous or kinked effect at a known cutoff; the identifying variation in regression-discontinuity designs.
  source: spark-curated
  license: CC0-1.0

- name: Threshold misspecification
  mechanism_tags: [nonlinear, specification]
  summary: Wrongly located or shaped thresholds split states incorrectly, blending distinct dynamics.
  source: spark-curated
  license: CC0-1.0

- name: Threshold selection
  mechanism_tags: [denoising, estimation]
  summary: Which detail coefficients count as signal rather than noise; too low keeps noise, too high kills signal.
