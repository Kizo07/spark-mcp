  license: CC0-1.0

- name: Unmeasured confounding
  mechanism_tags: [causal, identification]
  summary: Some confounders are unobserved; adjusted estimates keep bias of unknown size.
  source: spark-curated
  license: CC0-1.0

- name: Unmeasured mediator confounding
  mechanism_tags: [mediation, causal]
