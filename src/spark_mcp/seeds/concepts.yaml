  license: CC0-1.0

- name: Retail flow
  mechanism_tags: [flow, behavioral]
  summary: Retail order flow is small and noisy yet contrarily predictable around attention events.
  source: spark-curated
  license: CC0-1.0

- name: Rotation invariance
  mechanism_tags: [random_matrix, symmetry]
  summary: Noise eigenvalue laws are invariant to rotations of the return space; only departures from the null are informative.
