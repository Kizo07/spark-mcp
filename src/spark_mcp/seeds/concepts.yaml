# Spark seed corpus — Concept layer v0 (plan §16.1, Phase 2: ~40
# mechanism-concept nodes). These are the shared vocabulary that technique
# cards reference via `assumptions` / `failure_modes` (edges ASSUMES /
# FAILS_WHEN) and that structural-overlap novelty (§7) uses for grounding.
# Phase 3 nit fix: the layer grew to cover every concept referenced by the
# technique cards, so seed import resolves all ASSUMES/FAILS_WHEN references
# (unresolved_refs == 0; was 226/524 dropped into an aggregate counter).
# 2026-09-13 corpus-saturation pass: +16 concepts for the new microstructure /
# identification cards (247 -> 263; still unresolved_refs == 0).

- name: Stationarity
  mechanism_tags: [time_series, distributional_stability]
  summary: Statistical properties of a process are invariant to time shifts; the working assumption behind most inference and most mean-variance machinery.
  source: spark-curated
  license: CC0-1.0

- name: Ergodicity
  mechanism_tags: [time_series, ensemble_vs_path]
  summary: Time averages converge to ensemble averages; a single long history is representative of the process.
  source: spark-curated
  license: CC0-1.0

- name: Mean reversion
  mechanism_tags: [reversion, equilibrium]
  summary: Prices or spreads pull back toward a long-run level; the engine of contrarian and relative-value strategies.
  source: spark-curated
  license: CC0-1.0

- name: Trend persistence
  mechanism_tags: [momentum, continuation]
  summary: Past returns positively predict future returns over some horizon due to slow-moving capital and anchoring.
  source: spark-curated
  license: CC0-1.0

- name: Gradual information diffusion
  mechanism_tags: [information, underreaction]
  summary: News is incorporated into prices incompletely and over time, creating predictable drift after events.
  source: spark-curated
  license: CC0-1.0

- name: Limited arbitrage
  mechanism_tags: [arbitrage_constraints, behavioral]
  summary: Risk, capital and shorting constraints prevent mispricings from being fully corrected.
  source: spark-curated
  license: CC0-1.0

- name: Liquidity
  mechanism_tags: [trading, market_microstructure]
  summary: Ease of trading without moving the price; a priced risk, a cost, and a capacity limit all at once.
  source: spark-curated
  license: CC0-1.0

- name: Market impact
  mechanism_tags: [microstructure, price_impact]
  summary: Trades move prices against the trader; the binding constraint at size and the destroyer of paper alpha.
  source: spark-curated
  license: CC0-1.0

- name: Capacity constraint
  mechanism_tags: [scalability, crowding]
  summary: A strategy's edge decays as assets under management grow past what market impact allows.
  source: spark-curated
  license: CC0-1.0

- name: Crowding
  mechanism_tags: [herding, correlated_positions]
  summary: Many funds holding the same positions makes exits correlated and crashes sharper.
  source: spark-curated
  license: CC0-1.0

- name: Regime shift
  mechanism_tags: [nonstationarity, structural_change]
  summary: The data-generating process itself changes (vol, correlation, sign of premia); backtests break here.
  source: spark-curated
  license: CC0-1.0

- name: Structural break
  mechanism_tags: [nonstationarity, change_point]
  summary: A discrete change in model parameters at an unknown time; ruins stationarity-based inference.
  source: spark-curated
  license: CC0-1.0

- name: Volatility clustering
  mechanism_tags: [heteroskedasticity, garch]
  summary: Large moves beget large moves; volatility is autocorrelated even when returns are not.
  source: spark-curated
  license: CC0-1.0

- name: Heavy tails
  mechanism_tags: [tail_risk, kurtosis]
  summary: Return distributions have fatter tails than Gaussian; rare events dominate long-run outcomes.
  source: spark-curated
  license: CC0-1.0

- name: Skewness
  mechanism_tags: [asymmetry, lottery]
  summary: Asymmetric return distributions; investors overpay for positive skew, creating a premium for bearing negative skew.
  source: spark-curated
  license: CC0-1.0

- name: Autocorrelation
  mechanism_tags: [dependence, serial_correlation]
  summary: Observations correlated with their own past; breaks naive standard errors and naive novelty math.
  source: spark-curated
  license: CC0-1.0

- name: Heteroskedasticity
  mechanism_tags: [variance_nonconst, inference]
  summary: Error variance is not constant; OLS point estimates survive, inference does not.
  source: spark-curated
  license: CC0-1.0

- name: Cross-sectional independence
  mechanism_tags: [panel, inference]
  summary: Units observed at a point in time do not influence each other; the assumption behind cross-sectional standard errors.
  source: spark-curated
  license: CC0-1.0

- name: Normality
  mechanism_tags: [gaussian, inference]
  summary: Errors or returns follow a Gaussian law; the first assumption to check and the first to fail.
  source: spark-curated
  license: CC0-1.0

- name: Sparsity
  mechanism_tags: [variable_selection, regularization]
  summary: Only a few of many candidate variables truly matter; enables L1-style selection and shrinkage.
  source: spark-curated
  license: CC0-1.0

- name: Shrinkage
  mechanism_tags: [regularization, estimation]
  summary: Deliberately biasing estimates toward a target to reduce variance; the core of modern covariance and coefficient estimation.
  source: spark-curated
  license: CC0-1.0

- name: Overfitting
  mechanism_tags: [generalization, multiple_testing]
  summary: Fitting noise instead of signal; grows with every degree of freedom and every trial rerun.
  source: spark-curated
  license: CC0-1.0

- name: Multiple testing bias
  mechanism_tags: [inference, data_snooping]
  summary: Trying many variants inflates the best observed result; DSR/BH-style corrections exist for this.
  source: spark-curated
  license: CC0-1.0

- name: Data snooping
  mechanism_tags: [selection_bias, backtest]
  summary: Any contact between the researcher and the data before the test set leaks information into "in-sample" results.
  source: spark-curated
  license: CC0-1.0

- name: Look-ahead bias
  mechanism_tags: [leakage, backtest]
  summary: Using information not yet available at decision time; the classic silent killer of backtest Sharpe ratios.
  source: spark-curated
  license: CC0-1.0

- name: Survivorship bias
  mechanism_tags: [selection_bias, sample]
  summary: Dead members of the universe are missing from the data; inflates every historical premium estimate.
  source: spark-curated
  license: CC0-1.0

- name: Omitted variable bias
  mechanism_tags: [endogeneity, confounding]
  summary: Leaving out a cause of both regressor and outcome biases the coefficient; backdoor adjustment targets this.
  source: spark-curated
  license: CC0-1.0

- name: Confounding
  mechanism_tags: [causal, bias]
  summary: A common cause of treatment and outcome masquerading as a relationship between them.
  source: spark-curated
  license: CC0-1.0

- name: Endogeneity
  mechanism_tags: [causal, simultaneity]
  summary: Regressors correlate with the error term (reverse causality, omitted causes, measurement error).
  source: spark-curated
  license: CC0-1.0

- name: Exogeneity
  mechanism_tags: [causal, identification]
  summary: Regressors are uncorrelated with the error term; the identifying assumption of classical regression.
  source: spark-curated
  license: CC0-1.0

- name: Identification
  mechanism_tags: [causal, estimability]
  summary: Whether a causal quantity can in principle be recovered from the observed distribution and design.
  source: spark-curated
  license: CC0-1.0

- name: Cointegration
  mechanism_tags: [time_series, long_run]
  summary: Individually non-stationary series sharing a stationary long-run combination; the license for pairs trading.
  source: spark-curated
  license: CC0-1.0

- name: Signal-to-noise ratio
  mechanism_tags: [information, estimation]
  summary: How much true structure exists per unit of observed variance; the binding scarcity of financial data.
  source: spark-curated
  license: CC0-1.0

- name: Nonstationarity
  mechanism_tags: [time_series, drift]
  summary: Distributional properties evolve over time; breaks windowed estimation and most asymptotic promises.
  source: spark-curated
  license: CC0-1.0

- name: Measurement error
  mechanism_tags: [data_quality, attenuation]
  summary: Mismeasured variables attenuate or distort estimates; worsens with proxies and vendor data.
  source: spark-curated
  license: CC0-1.0

- name: Selection bias
  mechanism_tags: [sample, causal]
  summary: The sample is not representative because inclusion depends on outcomes or choices.
  source: spark-curated
  license: CC0-1.0

- name: Collider bias
  mechanism_tags: [causal, graphical_models]
  summary: Conditioning on a common effect induces spurious association between its causes.
  source: spark-curated
  license: CC0-1.0

- name: Exchangeability
  mechanism_tags: [causal, potential_outcomes]
  summary: Treated and control units would have identical outcome distributions under either treatment; the basis of causal inference.
  source: spark-curated
  license: CC0-1.0

- name: Latent factor structure
  mechanism_tags: [factor_models, dimensionality]
  summary: Many observed series driven by few unobserved forces; the premise of factor models, PCA and ICA.
  source: spark-curated
  license: CC0-1.0

- name: Markov property
  mechanism_tags: [stochastic_processes, memorylessness]
  summary: The future depends on the past only through the present state; the license for HMMs and regime models.
  source: spark-curated
  license: CC0-1.0

- name: Transaction costs
  mechanism_tags: [frictions, implementation]
  summary: Commissions, spreads and market impact paid per trade; the tax that turns most paper anomalies into losses at size.
  source: spark-curated
  license: CC0-1.0

- name: Estimation error
  mechanism_tags: [finite_sample, uncertainty]
  summary: Sample estimates deviate from population values; the source of mean-variance portfolio blowups and shrinkage methods.
  source: spark-curated
  license: CC0-1.0

- name: Whipsaw
  mechanism_tags: [false_signal, timing]
  summary: Rapid reversal after a trigger fires, inflicting serial small losses on trend-following and filter rules.
  source: spark-curated
  license: CC0-1.0

- name: Linearity
  mechanism_tags: [functional_form, additivity]
  summary: Response proportional to input; the default regression assumption and the first one nonlinear markets violate.
  source: spark-curated
  license: CC0-1.0

- name: Rational pricing
  mechanism_tags: [efficiency, no_arbitrage]
  summary: Prices reflect all available information up to frictions; the benchmark every anomaly is measured against.
  source: spark-curated
  license: CC0-1.0

- name: Leverage constraints
  mechanism_tags: [funding, margin]
  summary: Investors cannot borrow freely to scale low-risk positions, leaving beta anomalies alive.
  source: spark-curated
  license: CC0-1.0

- name: Shorting frictions
  mechanism_tags: [borrow, asymmetric_trading]
  summary: Borrow costs, recalls and regulatory limits make overpricing harder to correct than underpricing.
  source: spark-curated
  license: CC0-1.0

- name: Finite sample bias
  mechanism_tags: [small_sample, inference]
  summary: Asymptotically harmless estimators misbehave on the short histories finance actually has.
  source: spark-curated
  license: CC0-1.0

- name: Nonlinearity
  mechanism_tags: [functional_form, interaction]
  summary: Effects that change with regime, level or interactions; missed by linear models exactly when it matters.
  source: spark-curated
  license: CC0-1.0

- name: Network connectedness
  mechanism_tags: [graph_structure, dependence]
  summary: How tightly nodes in a network are linked; drives contagion, centrality value and community stability.
  source: spark-curated
  license: CC0-1.0

- name: Lottery demand
  mechanism_tags: [preference, skewness]
  summary: Investor preference for positively skewed payoffs lets overpriced lottery-like assets persist.
  source: spark-curated
  license: CC0-1.0

- name: Tail risk
  mechanism_tags: [extreme_events, downside]
  summary: Exposure to rare large losses that volatility measures miss; the bill for most carry and short-vol premia.
  source: spark-curated
  license: CC0-1.0

- name: Aliasing
  mechanism_tags: [sampling, frequency_domain]
  summary: High-frequency content folds into lower frequencies when the sampling rate is too low, creating spurious cycles.
  source: spark-curated
  license: CC0-1.0

- name: Anchoring bias
  mechanism_tags: [behavioral, underreaction]
  summary: Judgments overweight an initial reference point and adjust too little, sustaining predictable drift.
  source: spark-curated
  license: CC0-1.0

- name: Anticipation effects
  mechanism_tags: [behavioral, timing]
  summary: Agents act ahead of expected changes, moving outcomes before the nominal event date.
  source: spark-curated
  license: CC0-1.0

- name: Asymptotic normality
  mechanism_tags: [statistics, inference]
  summary: Estimators converge in distribution to a Gaussian as the sample grows, justifying standard errors and p-values.
  source: spark-curated
  license: CC0-1.0

- name: Autocorrelation structure
  mechanism_tags: [time_series, dependence]
  summary: Serial dependence follows a specific pattern; unmodeled autocorrelation biases tests and standard errors.
  source: spark-curated
  license: CC0-1.0

- name: Backwardation
  mechanism_tags: [futures, term_structure]
  summary: Futures trade below expected spot, paying a positive roll yield to longs; typical of shortage-prone commodities.
  source: spark-curated
  license: CC0-1.0

- name: Bandwidth sensitivity
  mechanism_tags: [rdd, nonparametric]
  summary: Local estimates swing materially with the bandwidth choice; high sensitivity signals fragile identification.
  source: spark-curated
  license: CC0-1.0

- name: Bias mechanisms
  mechanism_tags: [causal, mediation]
  summary: The specific causal paths through which bias reaches an estimate; naming them is required for valid adjustment.
  source: spark-curated
  license: CC0-1.0

- name: Bias variance tradeoff
  mechanism_tags: [estimation, prediction]
  summary: Flexibility cuts bias but adds variance; the tradeoff sets the best achievable out-of-sample error.
  source: spark-curated
  license: CC0-1.0

- name: Biased coefficients
  mechanism_tags: [estimation, bias]
  summary: Estimators that systematically miss true parameters; shrinkage trades such bias against variance.
  source: spark-curated
  license: CC0-1.0

- name: Both models misspecified
  mechanism_tags: [double_ml, causal]
  summary: Double robustness fails when both nuisance models are wrong; the estimator inherits both biases.
  source: spark-curated
  license: CC0-1.0

- name: Boundary effects
  mechanism_tags: [signal_processing, estimation]
  summary: Window edges distort estimates near the series ends; boundary values are systematically wrong.
  source: spark-curated
  license: CC0-1.0

- name: Causal Markov condition
  mechanism_tags: [causal, graphs]
  summary: Each variable is independent of its non-effects given its direct causes; links a causal graph to observable independences.
  source: spark-curated
  license: CC0-1.0

- name: Causal sufficiency
  mechanism_tags: [causal_discovery, confounding]
  summary: No unobserved common causes among measured variables; required for causal rather than associational discovery.
  source: spark-curated
  license: CC0-1.0

- name: Cointegration rank one
  mechanism_tags: [cointegration, pairs]
  summary: Exactly one long-run relationship binds the series; the single stationary spread is what pairs trading monetizes.
  source: spark-curated
  license: CC0-1.0

- name: Community structure
  mechanism_tags: [networks, clustering]
  summary: Nodes group into densely connected blocks; community detection exploits that organization.
  source: spark-curated
  license: CC0-1.0

- name: Compositional changes
  mechanism_tags: [panels, sampling]
  summary: The population's makeup shifts over time, creating spurious aggregate trends.
  source: spark-curated
  license: CC0-1.0

- name: Computational cost
  mechanism_tags: [numerics, scaling]
  summary: Compute time and memory grow with data size and model complexity; methods that don't fit the budget never run.
  source: spark-curated
  license: CC0-1.0

- name: Concentration
  mechanism_tags: [portfolio_construction, estimation_error]
  summary: Optimizers pile weights where estimates look best, so estimation error comes to dominate the book.
  source: spark-curated
  license: CC0-1.0

- name: Conditional independence tests
  mechanism_tags: [causal_discovery, testing]
  summary: Decisions of the form X independent of Y given Z; the raw material constraint-based structure learning is built from, with finite-sample error rates.
  source: spark-curated
  license: CC0-1.0

- name: Consistent estimators
  mechanism_tags: [statistics, inference]
  summary: Converge to the true parameter as data accumulates; without consistency, inference has no anchor.
  source: spark-curated
  license: CC0-1.0

- name: Contango drag
  mechanism_tags: [futures, term_structure]
  summary: Futures above expected spot impose a negative roll yield that bleeds long positions.
  source: spark-curated
  license: CC0-1.0

- name: Continuity
  mechanism_tags: [rdd, functional_form]
  summary: Outcome or signal varies smoothly through the cutoff or window; the working assumption behind local identification.
  source: spark-curated
  license: CC0-1.0

- name: Convexity mispricing
  mechanism_tags: [rates, options]
  summary: Linear models misprice nonlinear payoff curvature; the gap is extractable with convex instruments.
  source: spark-curated
  license: CC0-1.0

- name: Correct specification
  mechanism_tags: [specification, inference]
  summary: Functional form and regressors match the data-generating process; the prerequisite for valid inference.
  source: spark-curated
  license: CC0-1.0

- name: Correlated predictors
  mechanism_tags: [regression, multicollinearity]
  summary: Regressors move together, inflating coefficient variance and scrambling attribution.
  source: spark-curated
  license: CC0-1.0

- name: Correlation structure
  mechanism_tags: [dependence, covariance]
  summary: The pattern of pairwise dependencies; clustering, hedging and diversification all lean on it.
  source: spark-curated
  license: CC0-1.0

- name: Crash phobia
  mechanism_tags: [preferences, behavioral]
  summary: Aversion to rare crashes inflates the price of protection and depresses demand for skewed assets.
  source: spark-curated
  license: CC0-1.0

- name: Crash risk
  mechanism_tags: [tail_risk, discontinuity]
  summary: Exposure to sudden large repricing; the premium source for carry and short-volatility strategies.
  source: spark-curated
  license: CC0-1.0

- name: Crossing quantiles
  mechanism_tags: [quantile, estimation]
  summary: Estimated quantile curves that intersect violate monotonicity and mark noisy or mis-fit models.
  source: spark-curated
  license: CC0-1.0

- name: Dangling nodes
  mechanism_tags: [networks, structure]
  summary: Nodes with missing or one-way links; how they are treated changes rankings and centralities.
  source: spark-curated
  license: CC0-1.0

- name: Deal break
  mechanism_tags: [merger_arb, events]
  summary: An announced deal fails on antitrust, financing or votes; the spread violently re-widens, the tail risk of merger arb.
  source: spark-curated
  license: CC0-1.0

- name: Deal completion
  mechanism_tags: [merger_arb, events]
  summary: Announced mergers close at terms with high but imperfect probability; the spread prices that completion risk.
  source: spark-curated
  license: CC0-1.0

- name: Degeneracy
  mechanism_tags: [networks, optimization]
  summary: Many distinct near-optimal partitions or solutions of equal quality; the chosen one is arbitrary.
  source: spark-curated
  license: CC0-1.0

- name: Detectable violations
  mechanism_tags: [testing, monitoring]
  summary: Violations large enough for tests to flag at the available sample size; undetected is not absent.
  source: spark-curated
  license: CC0-1.0

- name: Discrete states
  mechanism_tags: [state_space, regimes]
  summary: The latent state takes finitely many values; filtering becomes classification among discrete labels.
  source: spark-curated
  license: CC0-1.0

- name: Donor pool contamination
  mechanism_tags: [synthetic_control, causal]
  summary: Donors touched by the treatment themselves break the synthetic-control counterfactual.
  source: spark-curated
  license: CC0-1.0

- name: Donor pool quality
  mechanism_tags: [synthetic_control, causal]
  summary: Donors must reproduce the treated unit's pre-treatment path; poor donors invalidate the counterfactual.
  source: spark-curated
  license: CC0-1.0

- name: Drawdowns
  mechanism_tags: [risk, path_dependence]
  summary: Peak-to-trough wealth declines along the path; the risk measure investors actually live.
  source: spark-curated
  license: CC0-1.0

- name: Drift detection
  mechanism_tags: [monitoring, change_point]
  summary: Timely flagging of distribution drift; slow detection leaves stale models trading wrong signals.
  source: spark-curated
  license: CC0-1.0

- name: Dynamic panel bias
  mechanism_tags: [panel, econometrics]
  summary: Lagged dependent variables correlate with unit fixed effects, biasing standard panel estimators (Nickell bias).
  source: spark-curated
  license: CC0-1.0

- name: Earnings persistence
  mechanism_tags: [earnings, accounting]
  summary: Reported earnings contain a slowly decaying persistent component; drift strategies monetize underreaction to it.
  source: spark-curated
  license: CC0-1.0

- name: Edge estimate accuracy
  mechanism_tags: [kelly, estimation]
  summary: Kelly sizing is only as good as the estimated edge; overestimated odds make the growth rate negative.
  source: spark-curated
  license: CC0-1.0

- name: Endpoint effects
  mechanism_tags: [emd, boundaries]
  summary: Spline-based decomposition is unstable at the series ends; end IMFs are unreliable.
  source: spark-curated
  license: CC0-1.0

- name: Equilibrium prior
  mechanism_tags: [black_litterman, priors]
  summary: Market-capitalization weights imply an equilibrium expected return used as the prior mean around which views are blended.
  source: spark-curated
  license: CC0-1.0

- name: Estimation accuracy
  mechanism_tags: [statistics, estimation]
  summary: How close estimates land to the truth; accuracy limits bound every downstream decision.
  source: spark-curated
  license: CC0-1.0

- name: Exclusion violation
  mechanism_tags: [iv, causal]
  summary: The instrument affects the outcome through a channel other than the treatment, violating the exclusion restriction.
  source: spark-curated
  license: CC0-1.0

- name: Event uncertainty
  mechanism_tags: [events, risk]
  summary: Binary catalysts resolve two-valued; the market often misprices their probabilities.
  source: spark-curated
  license: CC0-1.0

- name: Extrapolation
  mechanism_tags: [prediction, support]
  summary: Predicting outside the observed input support, where functional form is unearned and errors explode.
  source: spark-curated
  license: CC0-1.0

- name: Factor instability
  mechanism_tags: [factor_models, regimes]
  summary: Loadings and premia drift over time; one-window estimates misprice the next window.
  source: spark-curated
  license: CC0-1.0

- name: Factor model misspecification
  mechanism_tags: [factor_models, specification]
  summary: Omitted or mismeasured factors load on the apparent signal, inflating backtest Sharpe.
  source: spark-curated
  license: CC0-1.0

- name: Factor model validity
  mechanism_tags: [factor_models, specification]
  summary: A factor model must price the cross-section; invalid models leave residual structure masquerading as alpha.
  source: spark-curated
  license: CC0-1.0

- name: Factor structure
  mechanism_tags: [factor_models, covariance]
  summary: A small number of common factors drive return covariance; the remainder is near-idiosyncratic.
  source: spark-curated
  license: CC0-1.0

- name: Faithfulness
  mechanism_tags: [causal_discovery, graphs]
  summary: The graph entails exactly the observed conditional independences; the assumption that lets tests read off structure.
  source: spark-curated
  license: CC0-1.0

- name: Faithfulness violation
  mechanism_tags: [causal_discovery, graphs]
  summary: Independences the graph does not entail, or dependence it fails to entail, mislead constraint-based structure learners.
  source: spark-curated
  license: CC0-1.0

- name: False alarms
  mechanism_tags: [monitoring, testing]
  summary: Spurious change flags that trigger needless re-estimation and churn; controlled at a chosen alarm rate.
  source: spark-curated
  license: CC0-1.0

- name: False breakout
  mechanism_tags: [technical, whipsaw]
  summary: Price breaches a threshold and reverts without continuation, whipsawing breakout followers.
  source: spark-curated
  license: CC0-1.0

- name: Finite energy
  mechanism_tags: [signal_processing, spectra]
  summary: Signals carry finite total power, so spectra are integrable and transforms well-defined.
  source: spark-curated
  license: CC0-1.0

- name: Finite sample errors
  mechanism_tags: [statistics, inference]
  summary: Estimation and test errors at finite sample size; they compound through multi-step procedures.
  source: spark-curated
  license: CC0-1.0

- name: Financing costs
  mechanism_tags: [leverage, funding]
  summary: Borrowing and margin funding vary with conditions and erode levered strategy returns.
  source: spark-curated
  license: CC0-1.0

- name: Front running
  mechanism_tags: [microstructure, flow]
  summary: Trading ahead of known large orders extracts value from that flow; predictable own trades invite it.
  source: spark-curated
  license: CC0-1.0

- name: Gaussian approximation
  mechanism_tags: [filtering, approximation]
  summary: Propagating only mean and covariance approximates non-Gaussian beliefs; error grows with nonlinearity.
  source: spark-curated
  license: CC0-1.0

- name: Gaussian noise
  mechanism_tags: [noise, assumptions]
  summary: Independent normal disturbances; many estimators are optimal under it and merely adequate otherwise.
  source: spark-curated
  license: CC0-1.0

- name: Gaussian sources
  mechanism_tags: [ica, identification]
  summary: Independent Gaussian sources cannot be separated by ICA; identifiability dies exactly there.
  source: spark-curated
  license: CC0-1.0

- name: Graph misspecification
  mechanism_tags: [networks, specification]
  summary: Wrong edges, missing or spurious, break the smoothness and diffusion assumptions graph methods rely on.
  source: spark-curated
  license: CC0-1.0

- name: Grouping effect
  mechanism_tags: [regression, correlated_predictors]
