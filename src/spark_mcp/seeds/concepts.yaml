  license: CC0-1.0

- name: Tuning instability
  mechanism_tags: [cross_validation, hyperparameters]
  summary: Chosen hyperparameters swing with the validation split; unstable tuning invalidates the selected model.
  source: spark-curated
  license: CC0-1.0

- name: Unobserved confounding
  mechanism_tags: [causal, confounding]
  summary: A hidden variable drives both treatment and outcome; no adjustment on observed data removes it.
