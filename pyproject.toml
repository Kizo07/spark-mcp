[project]
name = "spark-mcp"
version = "0.1.0"
description = "Creativity and institutional-learning MCP for quant research organizations (Spark v3)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "sqlite-vec>=0.1.6",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
# pyribs is unavailable on this machine's package index (only a 0.0.2 stub is
# published there). The QD archive (Phase 5, outside the Phases 0-3 goal) must
# therefore ship a native numpy MAP-Elites fallback with pyribs as an optional
# accelerator. Tracked in STATUS.md.
qd = ["pyribs>=0.7.0"]
docling = ["docling>=2.0"]
embeddings-local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
spark = "spark_mcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
